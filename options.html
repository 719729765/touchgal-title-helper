<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-size:14px}
body{width:800px;margin:16px auto}
textarea{width:100%;height:180px;padding:10px;margin:10px 0}
.btns{margin:8px 0;gap:10px;display:flex;flex-wrap:wrap}
button{padding:8px 14px;cursor:pointer}
#result{margin-top:12px;max-height:380px;overflow:auto;border:1px solid #ccc;padding:10px}
.item{padding:5px 0;border-bottom:1px solid #eee;word-break:break-all}
.tool-box{margin:16px 0;padding:12px;border:1px solid #777}
.tool-box h3{margin-bottom:10px}
.cat-input-wrap{margin-bottom:8px;display:flex;gap:8px;align-items:center}
#catIdInput{width:180px;padding:6px}
</style>
</head>
<body>
<h2>批量链接标题提取工具（扩展选项页｜单Tab复用｜截取首个|前标题）</h2>
<textarea id="urlsInput" placeholder="一行粘贴一条链接"></textarea>
<div class="btns">
  <button id="startTask">启动后台抓取任务</button>
  <button id="exportCsv">导出CSV</button>
  <button id="clearAll">清空结果</button>
</div>
<div class="tool-box">
  <h3>批量打开工具（需抓取成功的数据）</h3>
  <div class="cat-input-wrap">
    <label>Kaogal搜索指定分类ID(留空不限制分类)：</label>
    <input id="catIdInput" type="number" placeholder="填写数字分类ID">
  </div>
  <div class="btns">
    <button id="openResMode">①原链接追加 ?tab=resources 批量打开</button>
    <button id="openKaogalMode">②Kaogal后台按标题搜索批量打开</button>
  </div>
</div>
<div id="result"></div>
<script src="options.js"></script>
</body>
</html>
